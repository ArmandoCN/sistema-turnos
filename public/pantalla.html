<!DOCTYPE html>
<html lang="es">
<!--
  Pantalla Pública para la sala de espera (pensada para un monitor o televisor).

  Funciona totalmente sola sin teclado ni mouse:
  - Muestra en grande los turnos que están siendo llamados y a qué ventanilla pasar.
  - Muestra el tiempo aproximado de espera de cada servicio y los próximos turnos en fila.
  - Se actualiza al instante cada vez que cambia algo en el sistema.
  - Reproduce un timbre suave ("din-don") generado por el propio navegador cuando
    llama a un turno nuevo, sin depender de archivos de sonido externos.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Turnos — Sala de Espera</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body class="vista-pantalla">
  <div class="contenedor">
    <header class="encabezado-vista">
      <div>
        <h1 class="encabezado-titulo">Sala de Espera — Turnos</h1>
        <p class="encabezado-subtitulo">Por favor permanezca atento a su número de turno y ventanilla</p>
      </div>
      <div class="encabezado-meta">
        <span id="estado-sse" class="estado-sse" aria-live="polite">
          <span class="indicador-punto" aria-hidden="true"></span>
          <span id="texto-sse">Conectando...</span>
        </span>
        <span id="reloj-servidor" class="reloj-servidor" aria-label="Fecha y hora del sistema">--/--/-- --:--</span>
      </div>
    </header>

    <main class="rejilla-dividida">
      <!-- Turnos que se están atendiendo en este momento -->
      <section class="panel" aria-labelledby="titulo-llamados">
        <h2 id="titulo-llamados" class="pantalla-titulo">Turnos Llamados</h2>
        <div id="lista-llamados" class="lista-llamados" aria-live="polite">
          <p class="texto-suave">Cargando turnos...</p>
        </div>
      </section>

      <!-- Tiempos aproximados de espera y lista de espera en orden de llegada -->
      <aside class="panel" aria-labelledby="titulo-espera">
        <h2 id="titulo-espera" class="pantalla-titulo">Tiempo Estimado de Espera</h2>

        <div class="tiempos-estimados-grid">
          <div class="tarjeta-estimado">
            <span class="estimado-servicio">Caja</span>
            <span id="estimado-caja" class="estimado-valor">5 min</span>
          </div>
          <div class="tarjeta-estimado">
            <span class="estimado-servicio">Ejecutivo</span>
            <span id="estimado-ejecutivo" class="estimado-valor">5 min</span>
          </div>
          <div class="tarjeta-estimado">
            <span class="estimado-servicio">Atención</span>
            <span id="estimado-atencion" class="estimado-valor">5 min</span>
          </div>
        </div>

        <h2 class="pantalla-titulo">Próximos en Espera</h2>
        <p id="espera-vacia" class="texto-suave">No hay turnos en espera.</p>
        <ul id="lista-espera" class="lista-espera"></ul>
        <p id="espera-restantes" class="texto-suave oculto"></p>
      </aside>
    </main>
  </div>

  <script src="/comun.js"></script>
  <script>
    const UI = window.TurnosUI;
    const MAX_ESPERA_VISIBLE = 10;

    const listaLlamados = document.getElementById('lista-llamados');
    const estimadoCaja = document.getElementById('estimado-caja');
    const estimadoEjecutivo = document.getElementById('estimado-ejecutivo');
    const estimadoAtencion = document.getElementById('estimado-atencion');
    const esperaVacia = document.getElementById('espera-vacia');
    const listaEspera = document.getElementById('lista-espera');
    const esperaRestantes = document.getElementById('espera-restantes');

    const reloj = UI.crearReloj(document.getElementById('reloj-servidor'));
    let contextoAudio = null;
    // Recordamos el último llamado que ya sonó para no repetir el timbre al recargar la página.
    let ultimoLlamadoSonado = null;

    // Prepara el generador de audio del navegador. Cuando el televisor abre Chrome en modo kiosco
    // con permiso automático de audio, suena directo sin necesidad de hacer clic primero.
    function obtenerAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      if (!contextoAudio) {
        contextoAudio = new AudioCtor();
      }
      return contextoAudio;
    }

    // Genera un timbre suave de dos tonos ("din-don") mediante ondas de sonido del navegador.
    async function reproducirTimbre() {
      const audio = obtenerAudio();
      if (!audio) return;

      try {
        if (audio.state === 'suspended') {
          await audio.resume();
        }

        const inicio = audio.currentTime;
        const notas = [
          { frecuencia: 659.25, retraso: 0, duracion: 0.35 },
          { frecuencia: 880.0, retraso: 0.18, duracion: 0.55 }
        ];

        for (const nota of notas) {
          const oscilador = audio.createOscillator();
          const volumen = audio.createGain();

          oscilador.type = 'sine';
          oscilador.frequency.setValueAtTime(nota.frecuencia, inicio + nota.retraso);

          // Subimos rápido el volumen y lo bajamos poco a poco para evitar chasquidos.
          volumen.gain.setValueAtTime(0.001, inicio + nota.retraso);
          volumen.gain.exponentialRampToValueAtTime(0.28, inicio + nota.retraso + 0.02);
          volumen.gain.exponentialRampToValueAtTime(0.001, inicio + nota.retraso + nota.duracion);

          oscilador.connect(volumen);
          volumen.connect(audio.destination);

          oscilador.start(inicio + nota.retraso);
          oscilador.stop(inicio + nota.retraso + nota.duracion + 0.02);
        }
      } catch (_) {
        // Si se abrió manualmente sin permiso de autoplay, evitamos mostrar errores en consola.
      }
    }

    // Dibuja los turnos actualmente en atención (el más reciente va destacado al principio).
    function dibujarLlamados(turnosAtendiendo, esNuevoLlamado) {
      listaLlamados.textContent = '';

      if (!turnosAtendiendo || turnosAtendiendo.length === 0) {
        listaLlamados.appendChild(
          UI.crearElemento('p', {
            clase: 'texto-suave',
            texto: 'En espera del próximo llamado a ventanilla.'
          })
        );
        return;
      }

      turnosAtendiendo.forEach((turno, indice) => {
        let claseTarjeta = 'tarjeta-llamado';
        if (indice === 0) {
          claseTarjeta += ' tarjeta-llamado--principal';
          if (esNuevoLlamado) {
            claseTarjeta += ' tarjeta-llamado--nuevo';
          }
        }

        const izquierda = UI.crearElemento('div', {
          hijos: [
            UI.crearElemento('div', { clase: 'llamado-codigo', texto: turno.codigo }),
            UI.crearElemento('span', {
              clase: `etiqueta etiqueta--${turno.tipo}`,
              texto: UI.SERVICIOS[turno.tipo] || turno.tipo
            })
          ]
        });

        const derecha = UI.crearElemento('div', {
          clase: 'llamado-ventanilla',
          texto: turno.ventanilla || ''
        });

        listaLlamados.appendChild(
          UI.crearElemento('article', {
            clase: claseTarjeta,
            hijos: [izquierda, derecha]
          })
        );
      });
    }

    // Actualiza los tiempos estimados y la fila de próximos turnos ordenados por llegada.
    function dibujarEspera(tiempos, proximos) {
      if (tiempos) {
        estimadoCaja.textContent = tiempos.caja || '5 min';
        estimadoEjecutivo.textContent = tiempos.ejecutivo || '5 min';
        estimadoAtencion.textContent = tiempos.atencion || '5 min';
      }

      listaEspera.textContent = '';

      if (!proximos || proximos.length === 0) {
        esperaVacia.classList.remove('oculto');
        esperaRestantes.classList.add('oculto');
        return;
      }

      esperaVacia.classList.add('oculto');
      const visibles = proximos.slice(0, MAX_ESPERA_VISIBLE);

      for (const turno of visibles) {
        listaEspera.appendChild(
          UI.crearElemento('li', {
            clase: 'item-espera',
            hijos: [
              UI.crearElemento('span', { texto: turno.codigo }),
              UI.crearElemento('span', {
                clase: `etiqueta etiqueta--${turno.tipo}`,
                texto: UI.SERVICIOS[turno.tipo] || turno.tipo
              })
            ]
          })
        );
      }

      const ocultos = proximos.length - visibles.length;
      if (ocultos > 0) {
        esperaRestantes.textContent = `+ ${ocultos} turnos adicionales en espera`;
        esperaRestantes.classList.remove('oculto');
      } else {
        esperaRestantes.classList.add('oculto');
      }
    }

    function aplicarEstado(estado, turnoLlamado = null) {
      if (!estado) return;
      reloj.sincronizar(estado.ahora);

      let esNuevoLlamado = false;
      if (turnoLlamado && turnoLlamado.id) {
        const clave = `${turnoLlamado.id}-${turnoLlamado.hora_llamado || ''}`;
        if (clave !== ultimoLlamadoSonado) {
          ultimoLlamadoSonado = clave;
          esNuevoLlamado = true;
          reproducirTimbre();
        }
      }

      dibujarLlamados(estado.turnosAtendiendo || [], esNuevoLlamado);
      dibujarEspera(estado.tiemposEstimados, estado.proximosEspera || []);
    }

    // Respaldo por si alguien abre esta vista en una PC normal sin políticas de kiosco:
    // desbloquea el audio al primer toque o tecla.
    function desbloquearAudio() {
      const audio = obtenerAudio();
      if (audio && audio.state === 'suspended') {
        audio.resume().catch(() => {});
      }
    }
    window.addEventListener('pointerdown', desbloquearAudio, { once: true });
    window.addEventListener('keydown', desbloquearAudio, { once: true });

    UI.obtenerEstado()
      .then((estado) => aplicarEstado(estado, null))
      .catch(() => {});

    UI.conectarEnVivo({
      cajaEstado: document.getElementById('estado-sse'),
      textoEstado: document.getElementById('texto-sse'),
      alRecibir: (aviso) => aplicarEstado(aviso.estado, aviso.turnoLlamado || null)
    });

    setInterval(() => reloj.actualizar(), 15000);
  </script>
</body>
</html>
