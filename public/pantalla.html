<!DOCTYPE html>
<html lang="es">
<!--
  pantalla.html - Pantalla pública para la sala de espera (TV o monitor)

  Esta pantalla no ocupa teclado ni mouse:
  - Muestra en grande el último turno llamado y los demás turnos que se están atendiendo.
  - Muestra el tiempo estimado de espera de cada servicio y los próximos turnos en fila.
  - Cuando llega un llamado nuevo por SSE, genera un timbre de dos tonos ("din-don")
    usando Web Audio API para no depender de archivos .mp3 externos.
  Nota: en la TV se recomienda abrir Chrome con "--autoplay-policy=no-user-gesture-required"
  para que el navegador deje sonar el timbre desde el primer turno sin pedir clic previo.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Turnos — Sala de Espera</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body class="vista-pantalla">
  <div class="contenedor">
    <header class="encabezado-vista">
      <div>
        <h1 class="encabezado-titulo">Sala de Espera — Turnos</h1>
        <p class="encabezado-subtitulo">Por favor permanezca atento a su número de turno y ventanilla</p>
      </div>
      <div class="encabezado-meta">
        <span id="estado-sse" class="estado-sse" aria-live="polite">
          <span class="indicador-punto" aria-hidden="true"></span>
          <span id="texto-sse">Conectando...</span>
        </span>
        <span id="reloj-servidor" class="reloj-servidor" aria-label="Fecha y hora del sistema">--/--/-- --:--</span>
      </div>
    </header>

    <main class="rejilla-dividida">
      <!-- Lado izquierdo: Turnos que están pasando a ventanilla -->
      <section class="panel" aria-labelledby="titulo-llamados">
        <h2 id="titulo-llamados" class="pantalla-titulo">Turnos Llamados</h2>
        <div id="lista-llamados" class="lista-llamados" aria-live="polite">
          <p class="texto-suave">Cargando turnos...</p>
        </div>
      </section>

      <!-- Lado derecho: Tiempo estimado por servicio y próximos en fila -->
      <aside class="panel" aria-labelledby="titulo-espera">
        <h2 id="titulo-espera" class="pantalla-titulo">Tiempo Estimado de Espera</h2>

        <div class="tiempos-estimados-grid">
          <div class="tarjeta-estimado">
            <span class="estimado-servicio">Caja</span>
            <span id="estimado-caja" class="estimado-valor">5 min</span>
          </div>
          <div class="tarjeta-estimado">
            <span class="estimado-servicio">Ejecutivo</span>
            <span id="estimado-ejecutivo" class="estimado-valor">5 min</span>
          </div>
          <div class="tarjeta-estimado">
            <span class="estimado-servicio">Atención</span>
            <span id="estimado-atencion" class="estimado-valor">5 min</span>
          </div>
        </div>

        <h2 class="pantalla-titulo">Próximos en Espera</h2>
        <p id="espera-vacia" class="texto-suave">No hay turnos en espera.</p>
        <ul id="lista-espera" class="lista-espera"></ul>
        <p id="espera-restantes" class="texto-suave oculto"></p>
      </aside>
    </main>
  </div>

  <script src="/comun.js"></script>
  <script>
    const UI = window.TurnosUI;
    const LIMITE_FILA_VISIBLE = 10;

    const listaLlamados = document.getElementById('lista-llamados');
    const estimadoCaja = document.getElementById('estimado-caja');
    const estimadoEjecutivo = document.getElementById('estimado-ejecutivo');
    const estimadoAtencion = document.getElementById('estimado-atencion');
    const esperaVacia = document.getElementById('espera-vacia');
    const listaEspera = document.getElementById('lista-espera');
    const esperaRestantes = document.getElementById('espera-restantes');

    const reloj = UI.crearReloj(document.getElementById('reloj-servidor'));
    let audioCtx = null;
    let ultimoTurnoSonado = null;

    function obtenerAudioContext() {
      const AudioClase = window.AudioContext || window.webkitAudioContext;
      if (!AudioClase) return null;
      if (!audioCtx) {
        audioCtx = new AudioClase();
      }
      return audioCtx;
    }

    // Genera el sonido de timbre ("din-don") con dos frecuencias usando el navegador
    async function sonarTimbre() {
      const ctx = obtenerAudioContext();
      if (!ctx) return;

      try {
        if (ctx.state === 'suspended') {
          await ctx.resume();
        }

        const ahora = ctx.currentTime;
        const tonos = [
          { freq: 659.25, inicio: 0, duracion: 0.35 },
          { freq: 880.0, inicio: 0.18, duracion: 0.55 }
        ];

        for (const t of tonos) {
          const osc = ctx.createOscillator();
          const ganancia = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(t.freq, ahora + t.inicio);

          ganancia.gain.setValueAtTime(0.001, ahora + t.inicio);
          ganancia.gain.exponentialRampToValueAtTime(0.28, ahora + t.inicio + 0.02);
          ganancia.gain.exponentialRampToValueAtTime(0.001, ahora + t.inicio + t.duracion);

          osc.connect(ganancia);
          ganancia.connect(ctx.destination);

          osc.start(ahora + t.inicio);
          osc.stop(ahora + t.inicio + t.duracion + 0.02);
        }
      } catch (_) {
        // Si el navegador bloqueó el audio por abrirse sin flag de kiosco, no tronamos la vista
      }
    }

    function pintarLlamados(turnosEnAtencion, resaltarPrimero) {
      listaLlamados.textContent = '';

      if (!turnosEnAtencion || turnosEnAtencion.length === 0) {
        listaLlamados.appendChild(
          UI.crearElemento('p', {
            clase: 'texto-suave',
            texto: 'En espera del próximo llamado a ventanilla.'
          })
        );
        return;
      }

      turnosEnAtencion.forEach((turno, idx) => {
        let clase = 'tarjeta-llamado';
        if (idx === 0) {
          clase += ' tarjeta-llamado--principal';
          if (resaltarPrimero) {
            clase += ' tarjeta-llamado--nuevo';
          }
        }

        const colIzquierda = UI.crearElemento('div', {
          hijos: [
            UI.crearElemento('div', { clase: 'llamado-codigo', texto: turno.codigo }),
            UI.crearElemento('span', {
              clase: `etiqueta etiqueta--${turno.tipo}`,
              texto: UI.SERVICIOS[turno.tipo] || turno.tipo
            })
          ]
        });

        const colDerecha = UI.crearElemento('div', {
          clase: 'llamado-ventanilla',
          texto: turno.ventanilla || ''
        });

        listaLlamados.appendChild(
          UI.crearElemento('article', {
            clase,
            hijos: [colIzquierda, colDerecha]
          })
        );
      });
    }

    function pintarFilaEspera(tiempos, proximos) {
      if (tiempos) {
        estimadoCaja.textContent = tiempos.caja || '5 min';
        estimadoEjecutivo.textContent = tiempos.ejecutivo || '5 min';
        estimadoAtencion.textContent = tiempos.atencion || '5 min';
      }

      listaEspera.textContent = '';

      if (!proximos || proximos.length === 0) {
        esperaVacia.classList.remove('oculto');
        esperaRestantes.classList.add('oculto');
        return;
      }

      esperaVacia.classList.add('oculto');
      const primeros = proximos.slice(0, LIMITE_FILA_VISIBLE);

      for (const turno of primeros) {
        listaEspera.appendChild(
          UI.crearElemento('li', {
            clase: 'item-espera',
            hijos: [
              UI.crearElemento('span', { texto: turno.codigo }),
              UI.crearElemento('span', {
                clase: `etiqueta etiqueta--${turno.tipo}`,
                texto: UI.SERVICIOS[turno.tipo] || turno.tipo
              })
            ]
          })
        );
      }

      const sobran = proximos.length - primeros.length;
      if (sobran > 0) {
        esperaRestantes.textContent = `+ ${sobran} turnos adicionales en espera`;
        esperaRestantes.classList.remove('oculto');
      } else {
        esperaRestantes.classList.add('oculto');
      }
    }

    function actualizarPantalla(estado, turnoRecienLlamado = null) {
      if (!estado) return;
      reloj.sincronizar(estado.ahora);

      let esNuevo = false;
      if (turnoRecienLlamado && turnoRecienLlamado.id) {
        const llave = `${turnoRecienLlamado.id}-${turnoRecienLlamado.hora_llamado || ''}`;
        if (llave !== ultimoTurnoSonado) {
          ultimoTurnoSonado = llave;
          esNuevo = true;
          sonarTimbre();
        }
      }

      pintarLlamados(estado.turnosAtendiendo || [], esNuevo);
      pintarFilaEspera(estado.tiemposEstimados, estado.proximosEspera || []);
    }

    // Por si la abren en una compu normal sin flag de autoplay, activamos el audio al primer clic
    function activarAudioManual() {
      const ctx = obtenerAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }
    window.addEventListener('pointerdown', activarAudioManual, { once: true });
    window.addEventListener('keydown', activarAudioManual, { once: true });

    UI.obtenerEstado()
      .then((estado) => actualizarPantalla(estado, null))
      .catch(() => {});

    UI.conectarEnVivo({
      cajaEstado: document.getElementById('estado-sse'),
      textoEstado: document.getElementById('texto-sse'),
      alRecibir: (datos) => actualizarPantalla(datos.estado, datos.turnoLlamado || null)
    });

    setInterval(() => reloj.actualizar(), 15000);
  </script>
</body>
</html>
