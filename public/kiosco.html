<!DOCTYPE html>
<html lang="es">
<!--
  Pantalla del Kiosco (Autoservicio para clientes).

  Aquí el cliente toca el servicio que necesita (Caja, Ejecutivo o Atención a Cliente),
  se genera su turno en el servidor, se manda a imprimir el ticket en rollo térmico de
  58 mm y después de 3 segundos la pantalla vuelve sola al inicio para el siguiente cliente.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosco de Turnos — Autoservicio</title>
  <link rel="stylesheet" href="/estilos.css">
</head>
<body class="vista-kiosco">
  <div class="contenedor">
    <header class="encabezado-vista">
      <div>
        <h1 class="encabezado-titulo">Tome su Turno</h1>
        <p class="encabezado-subtitulo">Seleccione el servicio que necesita para imprimir su ticket</p>
      </div>
      <div class="encabezado-meta">
        <span id="reloj-servidor" class="reloj-servidor" aria-label="Fecha y hora del sistema">--/--/-- --:--</span>
      </div>
    </header>

    <main class="kiosco-principal">
      <!-- Botones grandes para pantalla táctil -->
      <section id="pantalla-seleccion" aria-labelledby="instruccion-kiosco">
        <p id="instruccion-kiosco" class="kiosco-instruccion">Toque una opción para generar su turno</p>

        <div class="kiosco-opciones">
          <button type="button" class="btn-kiosco btn-kiosco--caja" data-tipo="caja">
            <span class="btn-kiosco-letra" aria-hidden="true">C</span>
            <span class="btn-kiosco-nombre">Caja</span>
            <span class="btn-kiosco-desc">Pagos, depósitos y movimientos en ventanilla</span>
          </button>

          <button type="button" class="btn-kiosco btn-kiosco--ejecutivo" data-tipo="ejecutivo">
            <span class="btn-kiosco-letra" aria-hidden="true">E</span>
            <span class="btn-kiosco-nombre">Ejecutivo</span>
            <span class="btn-kiosco-desc">Trámites, contrataciones y asesoría personalizada</span>
          </button>

          <button type="button" class="btn-kiosco btn-kiosco--atencion" data-tipo="atencion">
            <span class="btn-kiosco-letra" aria-hidden="true">A</span>
            <span class="btn-kiosco-nombre">Atención a Cliente</span>
            <span class="btn-kiosco-desc">Información general, dudas y seguimiento</span>
          </button>
        </div>
      </section>

      <!-- Confirmación temporal que ve el cliente mientras sale el ticket -->
      <section id="pantalla-confirmacion" class="panel kiosco-confirmacion oculto" aria-live="polite">
        <p class="texto-suave">Su turno generado es</p>
        <p id="confirmacion-codigo" class="kiosco-confirmacion-codigo">---</p>
        <p id="confirmacion-detalle" class="texto-suave"></p>
        <p class="texto-suave">Imprimiendo comprobante...</p>
      </section>
    </main>
  </div>

  <!-- Ventana emergente por si falla la conexión con el servidor -->
  <dialog id="modal-error" class="modal modal-error" aria-labelledby="modal-error-titulo">
    <h2 id="modal-error-titulo" class="modal-titulo">No se pudo generar el turno</h2>
    <p id="modal-error-mensaje"></p>
    <form method="dialog" class="modal-acciones">
      <button type="submit" class="btn btn-primario" autofocus>Aceptar</button>
    </form>
  </dialog>

  <!--
    Bloque exclusivo para la impresora térmica (58 mm).
    En la pantalla normal permanece oculto; al imprimir, la hoja de estilos oculta todo
    lo demás y deja únicamente el número de turno en grande y la fecha/hora exacta.
  -->
  <section id="ticket-impresion" class="solo-impresion" aria-hidden="true">
    <p id="ticket-codigo"></p>
    <p id="ticket-fecha"></p>
  </section>

  <script src="/comun.js"></script>
  <script>
    const UI = window.TurnosUI;

    const pantallaSeleccion = document.getElementById('pantalla-seleccion');
    const pantallaConfirmacion = document.getElementById('pantalla-confirmacion');
    const confirmacionCodigo = document.getElementById('confirmacion-codigo');
    const confirmacionDetalle = document.getElementById('confirmacion-detalle');
    const ticketCodigo = document.getElementById('ticket-codigo');
    const ticketFecha = document.getElementById('ticket-fecha');
    const modalError = document.getElementById('modal-error');
    const modalErrorMensaje = document.getElementById('modal-error-mensaje');
    const botonesServicio = document.querySelectorAll('.btn-kiosco[data-tipo]');

    const reloj = UI.crearReloj(document.getElementById('reloj-servidor'));
    let procesando = false;
    let timerRegreso = null;

    // Bloquea o libera los 3 botones para evitar que un doble toque genere dos tickets seguidos.
    function bloquearBotones(bloqueado) {
      procesando = bloqueado;
      for (const boton of botonesServicio) {
        boton.disabled = bloqueado;
      }
    }

    function volverAInicio() {
      clearTimeout(timerRegreso);
      timerRegreso = null;
      pantallaConfirmacion.classList.add('oculto');
      pantallaSeleccion.classList.remove('oculto');
      bloquearBotones(false);
    }

    async function pedirTurno(tipo) {
      if (procesando) return;
      bloquearBotones(true);

      try {
        const datos = await UI.enviarDatos('/api/turnos', { tipo });
        const turno = datos.turno;
        const fechaImpresion = turno.fechaHoraImpresion || UI.formatearFechaHora(reloj.ahoraMs());

        // Preparamos primero el ticket oculto y el mensaje visible en pantalla.
        ticketCodigo.textContent = turno.codigo;
        ticketFecha.textContent = fechaImpresion;

        confirmacionCodigo.textContent = turno.codigo;
        confirmacionDetalle.textContent = `${UI.SERVICIOS[tipo] || tipo} • ${fechaImpresion}`;
        pantallaSeleccion.classList.add('oculto');
        pantallaConfirmacion.classList.remove('oculto');

        // Esperamos a que el navegador dibuje el nuevo código antes de abrir la impresión.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            try {
              window.print();
            } finally {
              clearTimeout(timerRegreso);
              timerRegreso = setTimeout(volverAInicio, 3000);
            }
          });
        });
      } catch (error) {
        UI.mostrarAviso(
          modalError,
          modalErrorMensaje,
          error.message || 'No se pudo conectar con el servidor de turnos.'
        );
        bloquearBotones(false);
      }
    }

    // Conectamos los 3 botones táctiles de servicio.
    for (const boton of botonesServicio) {
      boton.addEventListener('click', () => pedirTurno(boton.dataset.tipo));
    }

    // Sincronizamos el reloj al abrir y lo refrescamos cada 15 segundos.
    UI.obtenerEstado()
      .then((estado) => reloj.sincronizar(estado.ahora))
      .catch(() => reloj.actualizar());

    setInterval(() => reloj.actualizar(), 15000);
  </script>
</body>
</html>
